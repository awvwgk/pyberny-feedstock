{% set name = "pyberny" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyberny-{{ version }}.tar.gz
  sha256: 54729005140f8b8d98db72d5fa635d994e1cb74666b15c02ff08e5312808abd5
  patches:

build:
  entry_points:
    - berny = berny.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=0.12.3
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21.0,<3.0.0
    - molsym >=0.2.1

test:
  imports:
    - berny
  commands:
    - pip check
    - berny --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jhrmnn/pyberny
  summary: Molecular/crystal structure optimizer
  license: MPL-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - awvwgk
